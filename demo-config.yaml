# Backend credentials. One block per backend; only the backends that a
# store below refers to are logged in.
backends:
  telegram:
    api_id: hidden
    api_hash: hidden
    bot:
      session_file: bot.session
      tokens:
        - hidden
    lib: pyrogram
    # When ``true``, removing a file (or directory) through TGDCFS also issues
    # ``messages.deleteMessages`` for every backing message in the channel:
    # the JSON file-descriptor message and every content message of every
    # version. Default is ``false`` -- metadata is updated but the original
    # messages stay in the channel, matching historical behavior.
    # The bot account must be an admin of every store's channel with the
    # "Delete Messages" permission for this to succeed.
    delete_messages_on_remove: false

  # Discord: one or more bot tokens and the attachment limit of the
  # server (20 MB unboosted since August 2026, 50 MB at boost level 2,
  # 100 MB at level 3). Files are cut into parts of ``max_file_size_bytes``.
  # discord:
  #   bot_tokens:
  #     - hidden
  #   max_file_size_bytes: 10000000
  #   delete_messages_on_remove: false

# Stores: one channel of one backend, under a name of your choosing. The
# name is only used in this file; the metadata refers to a store by
# ``<backend prefix>:<channel>`` (here ``tg:tgdcfsdemo``), so renaming a
# store is safe.
stores:
  demo:
    backend: telegram
    channel: 'tgdcfsdemo'
  # demo-mirror:
  #   backend: telegram
  #   channel: 'tgdcfsdemomirror'
  # demo-discord:
  #   backend: discord
  #   channel: '123456789012345678'

# File systems: one top-level directory each, backed by a primary store
# and optional mirror stores. Swapping ``primary`` and a mirror promotes
# the mirror; see the README.
#
# ``mode``: auto (server-side copy where the pair of stores allows it,
# re-upload otherwise) | forward (server-side only) | reupload.
# ``sync``: inline (mirror inside the write) | background (queue the file
# and copy it from a background worker). Left out, it is background as
# soon as a mirror has to re-upload (Discord on either side, another
# backend, ``mode: reupload``) and inline for Telegram-to-Telegram
# forwarding. ``strict: true`` fails an upload when mirroring fails and
# requires ``sync: inline``.
#
# ``write_ack``: primary (default; the PUT lasts until the primary has
# the bytes) | cache (answer once the bytes are in the local cache and
# distribute them to primary and mirrors in parallel afterwards; needs
# ``tgdcfs.cache.enabled`` and is refused with ``strict: true``). Between
# the answer and the primary's copy the bytes live only on this host.
# ``read_parallel``: read large files from every store that holds a
# complete copy at once; ``read_sources`` restricts that to the named
# stores of this file system.
#
# Requirements for mirrors: your bot(s) must be admin in every mirror
# channel; a primary with "Restrict saving content" enabled needs
# ``mode: reupload`` or ``auto``. Files that existed before a mirror was
# added are copied by the backfill task
# (Manager API: POST /api/redundancy/backfill/<filesystem>).
filesystems:
  default:
    primary: demo
    # mirrors: [demo-mirror]
    # mode: auto
    # sync: inline
    # strict: false
    # write_ack: primary
    # read_parallel: false
    # read_sources: []
    metadata:
      type: github_repo
      github_repo:
        repo: 'tgdcfs-demo/tgdcfs-demo'
        commit: 'master'
        access_token: hidden

tgdcfs:
  users:
  jwt:
    secret: hidden
    algorithm: HS256
    life: 604800
  server:
    host: 0.0.0.0
    port: 1900
  # ---------------------------------------------------------------------------
  # Optional SFTP interface, served next to WebDAV.
  #
  # It exposes the same file tree and reuses the `users` above, so a readonly
  # user stays readonly here too. It needs a port of its own -- SSH cannot
  # share the HTTP port.
  #
  # `host_key_file` is created on first start (ed25519, mode 0600) when it is
  # missing. Back it up: without it every restart presents a new host key and
  # clients refuse to connect until their known_hosts entry is cleared.
  #
  # `authorized_keys_dir` (optional) additionally enables public key login:
  # one file <dir>/<username> per user, in the usual authorized_keys format.
  # The user must still be listed under `users` so the readonly flag applies.
  #
  # `upload_buffer_size_mb` (default 64) is how much of an incoming upload is
  # held in memory before it spills to `upload_buffer_dir` (system temp when
  # empty). SFTP does not announce the file size up front while Telegram
  # uploads need it, so a whole file has to be buffered before it is sent.
  # ---------------------------------------------------------------------------
  sftp:
    enabled: false
    host: 0.0.0.0
    port: 2222
    host_key_file: sftp_host_key
    # authorized_keys_dir: sftp_authorized_keys
    # upload_buffer_size_mb: 64
    # upload_buffer_dir: ''
  # ---------------------------------------------------------------------------
  # Optional transfer tuning.
  #
  # Every value below has a default that matches the behaviour you get
  # without this block, so it can be left out entirely.
  #
  # Downloads are cut into pieces of ``download_piece_size_kb`` and
  # ``download_pieces_in_flight`` of them are fetched at the same time.
  # Bytes have to be handed out in order, so a piece that arrives early
  # waits for its turn: peak buffering per download is the two multiplied
  # together -- 16 MiB with the defaults. Raising either speeds up a single
  # large download and costs memory for every concurrent reader.
  #
  # ``connection_pool_size`` is how many MTProto connections each bot
  # opens. A single connection sends its requests one after another, so a
  # deployment with only one bot token gains the most here. With several
  # bot tokens the pieces already spread across them.
  #
  # ``chunk_cache_mb`` caches downloaded blocks in memory, which is what
  # makes overlapping reads -- video seeking, SFTP clients walking a file
  # in small reads -- stop re-fetching the same bytes. 0 disables it.
  # ``chunk_cache_readahead`` additionally pulls that many blocks past
  # each request, so the next sequential read is already there, and
  # ``chunk_cache_block_kb`` is the unit it caches in -- a read of a few
  # kilobytes pulls a whole block.
  # ---------------------------------------------------------------------------
  # transfer:
  #   upload_workers_small: 3
  #   upload_workers_big: 8
  #   upload_part_size_kb: 512      # must divide 512; Telegram caps it there
  #   download_piece_size_kb: 4096
  #   download_pieces_in_flight: 4
  #   parallel_download_threshold_mb: 10
  #   connection_pool_size: 1
  #   chunk_cache_mb: 0
  #   chunk_cache_readahead: 2
  #   chunk_cache_block_kb: 1024
  #   upload_parts_in_flight: 1   # parts of one version sent at once from a cache file
  #   read_parallel_window: 8     # reorder window of a multi-source read, in pieces

  # ---------------------------------------------------------------------------
  # Optional local cache, off by default. See the README, "Local cache".
  #
  # Uploads are staged into ``dir`` as they stream to the primary, so a
  # mirror that has to re-upload reads them from disk instead of
  # downloading the file from the primary again. With ``keep_for_reads``
  # the entries stay afterwards and downloads fill them block by block,
  # so repeated reads are served from disk. The cache is also what makes
  # ``write_ack: cache`` and parallel uploads to Telegram possible.
  #
  # ``max_size_mb`` is a hard ceiling for the directory (0 = unlimited):
  # when no unpinned entry can be evicted, a version is simply not
  # cached and the transfer goes on without the cache. ``max_files`` bounds
  # the number of cached versions (0 = unlimited) and a version above
  # ``max_file_size_mb`` is not staged whole; reads of it are still cached
  # block by block, as a read fill is admitted per block. Entries a mirror is
  # still waiting for are pinned and never evicted, so the budget has to
  # hold the uploads in flight on top of what you keep for reads. With
  # encryption on, the cache holds ciphertext. A relative ``dir`` lives in
  # the data directory, on the mounted volume in Docker.
  #
  # ``min_free_mb`` is headroom the cache leaves on the disk for everything
  # else in the data directory (0 = off). A sweep every 15 minutes drops
  # entries unread for ``max_age_hours`` (0 = never) and evicts down to
  # ``target_fill_percent`` of ``max_size_mb`` (100 = only when an upload
  # needs the room).
  # ---------------------------------------------------------------------------
  # cache:
  #   enabled: true
  #   dir: cache
  #   max_size_mb: 20480
  #   max_files: 0
  #   max_file_size_mb: 4096
  #   block_kb: 4096
  #   stage_uploads: true
  #   keep_for_reads: true
  #   min_free_mb: 1024
  #   max_age_hours: 0
  #   target_fill_percent: 90

  # ---------------------------------------------------------------------------
  # Optional at-rest encryption.
  #
  # When ``enabled: true``, every file uploaded through TGDCFS is encrypted with
  # AES-256-GCM in 64 KiB chunks *before* it leaves this process. The Telegram
  # channel never sees plaintext, so a compromised channel reveals only
  # ciphertext + a public salt per file.
  #
  # Three ways to supply the passphrase, pick exactly one:
  #   * passphrase       -- inline string (NOT recommended outside dev)
  #   * passphrase_env   -- read from an environment variable
  #   * passphrase_file  -- read from a file (use systemd ``LoadCredential=``)
  #
  # ``master_salt_file`` is created on first run (16 random bytes) and MUST be
  # backed up. Without it the master key cannot be re-derived.
  #
  # ``chunk_size`` defaults to 65536 (64 KiB). Larger -> less overhead, worse
  # random-access granularity; smaller -> more per-chunk auth-tag cost.
  #
  # ``encrypt_names`` (default ``false``) additionally replaces every
  # Telegram-visible document name -- including the pinned metadata blob --
  # with an AES-GCM ciphertext token, so a passive observer of the channel
  # cannot read file or directory names from document metadata. The
  # plaintext names continue to live inside the (also encrypted)
  # metadata.json, so WebDAV and the manager UI are unaffected.
  # Note: only new uploads are affected; previously uploaded files keep
  # their original Telegram document name.
  # ---------------------------------------------------------------------------
  encryption:
    enabled: false
    encrypt_names: false
    # passphrase: "change-me-or-use-a-file"
    passphrase_env: TGDCFS_MASTER_PASSPHRASE
    # passphrase_file: secrets/master.passphrase
    master_salt_file: master.salt
    chunk_size: 65536
